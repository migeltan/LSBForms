<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <g transform="translate(250,250)">
    <!-- 8 sword/pentagon-blade shaped rays, wider, with a gap before the circle -->
    <g fill="url(#rayGradient)" stroke="#EF6C00" stroke-width="3" stroke-linejoin="round">
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(0)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(45)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(90)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(135)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(180)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(225)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(270)"/>
      <polygon points="0,-230 32,-178 20,-115 -20,-115 -32,-178" transform="rotate(315)"/>
    </g>

    <!-- Central geometric sun body -->
    <circle r="95" fill="url(#sunGradient)" stroke="#EF6C00" stroke-width="3"/>
    <polygon points="0,-70 49,-49 70,0 49,49 0,70 -49,49 -70,0 -49,-49"
             fill="#FFC107" opacity="0.55"/>
    <polygon points="0,-45 32,-32 45,0 32,32 0,45 -32,32 -45,0 -32,-32"
             fill="#FFE082" opacity="0.6"/>
  </g>
</svg>
